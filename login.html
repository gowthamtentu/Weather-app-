<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login | SkyCast</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <div class="auth-page">

        <div class="auth-card">

            <div class="auth-logo">
                🌤️ SkyCast
            </div>

            <h1>Welcome Back</h1>

            <p class="auth-subtitle">
                Login to check the latest weather.
            </p>

            <form id="loginForm">

                <label>Email</label>

                <input
                    type="email"
                    id="loginEmail"
                    placeholder="Enter your email"
                    required
                >

                <label>Password</label>

                <input
                    type="password"
                    id="loginPassword"
                    placeholder="Enter your password"
                    required
                >

                <button type="submit" class="auth-btn">
                    Login
                </button>

            </form>

            <p id="loginMessage"></p>

            <p class="switch-auth">
                Don't have an account?
                <a href="signup.html">Create Account</a>
            </p>

        </div>

    </div>

    <script src="js/auth.js"></script>

</body>
</html>
