<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Admin Login | SkyCast</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <div class="auth-page">

        <div class="auth-card">

            <div class="auth-logo">
                🛠️ SkyCast Admin
            </div>

            <h1>Admin Login</h1>

            <p class="auth-subtitle">
                Manage the SkyCast weather application.
            </p>

            <form id="adminLoginForm">

                <label>Admin Email</label>

                <input
                    type="email"
                    id="adminEmail"
                    placeholder="Enter admin email"
                    required
                >

                <label>Password</label>

                <input
                    type="password"
                    id="adminPassword"
                    placeholder="Enter admin password"
                    required
                >

                <button type="submit" class="auth-btn">
                    Admin Login
                </button>

            </form>

            <p id="adminMessage"></p>

            <p class="switch-auth">
                <a href="index.html">← Back to Home</a>
            </p>

        </div>

    </div>

    <script src="js/admin.js"></script>

</body>
</html>
